apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yandex-vk-bot-ingress
  labels:
    app: yandex-vk-bot
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: yandex-vk-bot-service
            port:
              number: 80